apiVersion: apps/v1
kind: Deployment

metadata:
  name: python-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: python-app

  template:
    metadata:
      labels:
        app: python-app

    spec:
      containers:
      - name: python-container
        image: YOUR_DOCKER_USERNAME/python-hello-app:latest

        ports:
        - containerPort: 80